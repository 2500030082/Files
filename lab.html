
<!DOCTYPE html>
<html>
<head>
    <title>Travel Booking</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        h1 {
            background-color: blue;
            color: white;
            padding: 15px;
        }

        a {
            margin: 10px;
            color: black;
        }

        a:hover {
            color: red;
            transition: 0.5s;
        }

        div {
            background-color: white;
            margin: 20px;
            padding: 10px;
            transition: 0.5s;
        }

        div:hover {
            background-color: lightyellow;
        }

        button:hover {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>Travel Booking</h1>

    <a href="#dest">Destinations</a>
    <a href="#pack">Packages</a>
    <a href="#book">Booking</a>
    <a href="#contact">Contact</a>

    <div id="dest">
        <h2>Destinations</h2>
        <p>Goa | Paris | Dubai</p>
    </div>

    <div id="pack">
        <h2>Travel Packages</h2>
        <p>Goa - Rs.5000</p>
        <p>Paris - Rs.20000</p>
    </div>

    <div id="book">
        <h2>Booking Details</h2>
        Name: <input type="text"><br><br>
        Date: <input type="date"><br><br>
        <button>Book Now</button>
    </div>

    <div id="contact">
        <h2>Contact Us</h2>
        <p>Email: travel@gmail.com</p>
        <p>Phone: 1234567890</p>
    </div>

</body>
</html>
